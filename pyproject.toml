[project]
name = "portfolio-tracker"
version = "0.2.0"
description = "Personal investment tracker with FIFO tax lots, German capital-gains treatment and daily FX revaluation"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Mert Alpaydin" }]
keywords = ["portfolio", "investing", "fifo", "german-tax", "fx"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Added as the phases that need them land, so the foundation does not
# carry dependencies it never exercises.
ingest = ["httpx>=0.27", "yfinance>=0.2.40"]
# No jinja2: the debug page is rendered by `api/render.py` in plain Python.
# A template engine buys nothing for one page and costs a second place where
# escaping can be forgotten.
api = ["fastapi>=0.111", "uvicorn>=0.30"]
analysis = ["pandas>=2.2", "numpy>=1.26"]

[project.scripts]
pt = "portfolio_tracker.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    # fastapi.testclient needs it, and the test suite must not depend on it
    # arriving as a transitive of the `ingest` extra.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_tracker"]

# ---------------------------------------------------------------------
# Ruff — replaces black + isort + flake8 + pyupgrade
# ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is excluded deliberately. Recent ruff formats Python inside fenced
# code blocks, which would rewrite illustrative snippets in the design docs --
# those are prose about an API, not code that has to compile.
extend-exclude = ["data", "docs/reference", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# These files deliberately contain the confusable characters the corpus is
# built from -- Turkish dotless i, currency glyphs, non-breaking spaces.
# RUF001-003 flag exactly those, correctly, so the rule stays on everywhere
# else and is waived only where the ambiguity is the subject under test.
"tests/test_parse.py" = ["RUF001", "RUF002", "RUF003", "E501"]
"tests/test_example_data.py" = ["RUF001", "RUF002", "RUF003", "E501"]
# Strips the export's own currency glyph and its trailing U+00A0. Naming
# the characters is the point; a transliteration would not match the file.
"tests/test_example_pipeline.py" = ["RUF001"]
# Plus E501: the LANDMINES table is a data structure of prose sentences, and
# wrapping them across lines would hurt the thing it exists to communicate.
"scripts/make_example_data.py" = ["RUF001", "RUF002", "RUF003", "E501"]
# Matches Turkish fund names against their own spelling: altin with the
# dotless i, gumus with the cedilla. Transliterating them would stop them
# matching the names they exist to recognise.
"src/portfolio_tracker/core/classify.py" = ["RUF001"]
# Same reason: the Turkish fund names under test are spelled as they are.
"tests/test_classify.py" = ["RUF001", "E501"]
# Documents the TEFAS export's real header lines verbatim, Turkish dotless i
# included. Transliterating them would make the docstring not match the file
# it describes.
"src/portfolio_tracker/ingest/providers/manual.py" = ["RUF002"]
# Names the Turkish holidays it encodes, in Turkish. Transliterating them
# would make the table harder to check against an official calendar.
"src/portfolio_tracker/core/calendars.py" = ["RUF003"]

# B008 exists because a mutable default evaluated once is a bug. FastAPI's
# Depends/Query are the opposite: evaluating them at definition time is the
# entire mechanism, and the objects are immutable descriptors.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------
# mypy — strict where Decimal-vs-float confusion is the real bug class,
# relaxed where strictness would be ceremony.
# ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = "portfolio_tracker.cli"
disallow_untyped_decorators = false  # typer's decorators are untyped

[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "realdata: requires the user's real (gitignored) CSVs; skipped in CI",
]

[tool.coverage.run]
source = ["src/portfolio_tracker"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
