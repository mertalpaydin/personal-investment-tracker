# The comparison universe: instruments the tool prices so your holdings
# have something to be measured against.
#
# Public market data only -- index membership and published fund fees. It
# carries nothing about the owner, which is why it ships with the app
# instead of living in the gitignored seeds/ directory.
#
# Loaded on request, never automatically: it adds roughly 190 instruments
# to the daily price fetch, and that is the owner's decision to make.
#
# Nothing here is a recommendation. It is a comparison set, chosen for
# size and liquidity so that a peer scan has somewhere to look.
#
# `ter_bps` is the only figure that cannot be fetched -- it is read off
# each fund's KID by hand, and is absent for single shares, which have no
# ongoing charge.

version: 1

